name: 과거 10년 테스트
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python backtest.py
      - name: 결과 저장
        run: |
          git config user.name "stock-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results
          git commit -m "과거 테스트 결과 업데이트" || echo "변경 없음"
          git push
